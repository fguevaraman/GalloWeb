# Adaptador de Netlify. Lo único específico de la plataforma:
# el resto del sitio son archivos estáticos y un handler portable en api/.

[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # El hash de la contraseña viaja con la función, no como variable de entorno.
  included_files = ["config/admin.json"]

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# config/ no se sirve como estático: la función lo lee del disco, el navegador no.
# En otro hosting es la única regla equivalente que hay que escribir
# (Vercel: "rewrites"/"headers"; Apache: un Deny en .htaccess).
[[redirects]]
  from = "/config/*"
  to = "/index.html"
  status = 404

# El catálogo se revalida siempre: cuando el panel publica, el cambio
# tiene que verse enseguida y no quedar cacheado.
[[headers]]
  for = "/productos.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
